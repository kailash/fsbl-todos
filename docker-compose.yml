version: '3.8'

services:
  mongo:
    image: mongo:4.4
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./Todo
    environment:
      MONGO_DATABASENAME: todoapp
      MONGO_URL: mongodb://mongo:27017/todoapp
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    restart: on-failure

  frontend:
    build:
      context: ./todo-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo-data:
